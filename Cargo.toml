[workspace]
resolver = "3"
members = ["crates/forgevcs-service"]
# `upstream/` has its own [workspace] root and its own gate. Without this,
# cargo would auto-claim the vendored crates as members of *this* workspace and
# try to resolve their `version.workspace = true` inheritance here.
exclude = ["upstream"]

# ForgeVCS is its own workspace. `upstream/` is vendored Scion and remains a
# *separate* cargo workspace: its own scripts/check.sh re-roots itself to
# `upstream/`, so the W0 gate keeps meaning exactly what it meant before
# vendoring (same crates, same tests, same layering rules). We consume it
# read-only, by path. See docs/adr/0001-infrastructure-stack.md §6.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# ---- vendored Scion (read-only) ----
scion-core = { path = "upstream/crates/scion-core" }
scion-obs = { path = "upstream/crates/scion-obs" }
scion-store = { path = "upstream/crates/scion-store" }
scion-store-s3 = { path = "upstream/crates/scion-store-s3" }
scion-store-crdb = { path = "upstream/crates/scion-store-crdb" }
scion-config = { path = "upstream/crates/scion-config" }
scion-auth = { path = "upstream/crates/scion-auth" }
scion-policy = { path = "upstream/crates/scion-policy" }
scion-server = { path = "upstream/crates/scion-server" }
scion-proto = { path = "upstream/crates/scion-proto" }
scion-object = { path = "upstream/crates/scion-object" }
scion-wc = { path = "upstream/crates/scion-wc" }

# ---- versions pinned to match upstream exactly, so one Cargo.lock serves both ----
bytes = "=1.12.1"
axum = "=0.8.9"
tokio = { version = "=1.53.3", features = ["full"] }
tower = { version = "=0.5.3", features = ["util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "tls-ring", "tls-native-roots", "codegen", "router", "server", "channel"] }
tonic-prost = "=0.14.6"
prost = "=0.14.4"
futures = "=0.3.34"
base64 = "=0.22.1"
hex = "=0.4.3"
tokio-stream = { version = "=0.1.19", features = ["net"] }
tempfile = "=3.27.0"
uuid = { version = "=1.28.0", features = ["v4"] }
anyhow = "=1.0.104"
tracing = "=0.1.44"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
