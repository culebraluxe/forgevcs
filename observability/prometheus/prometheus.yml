global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: forgevcs
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ForgeVCS exposes the shared metrics registry on the public router. Vercel
  # does not scrape it, so this Prometheus instance is the collector.
  - job_name: forgevcs
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - culebraluxe-forgevcs.vercel.app
        labels:
          instance: culebraluxe-forgevcs

  # Readiness/health are blackbox probes, not Prometheus metrics.
  - job_name: forgevcs-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://culebraluxe-forgevcs.vercel.app/ready
        labels:
          probe: ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: forgevcs-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://culebraluxe-forgevcs.vercel.app/health
        labels:
          probe: health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
