groups:
  - name: forgevcs
    interval: 30s
    rules:
      - alert: ForgeVCSMetricsDown
        expr: up{job="forgevcs"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ForgeVCS metrics endpoint is down
          description: Prometheus cannot scrape /metrics. Check /ready and the latest deployment.

      - alert: ForgeVCSNotReady
        expr: probe_success{job="forgevcs-ready"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ForgeVCS /ready is failing
          description: The readiness probe has failed for 2 minutes. Check Postgres and object storage connectivity.

      - alert: ForgeVCSLandFailureRatioHigh
        expr: |
          (sum(rate(scion_land_attempts{result="failed"}[5m]))
           / clamp_min(sum(rate(scion_land_attempts[5m])), 0.000001)) > 0.05
          and
          sum(rate(scion_land_attempts[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ForgeVCS land failure ratio above 5%
          description: More than 5% of land attempts are failing over the last 5 minutes.

      - alert: ForgeVCSConflictPausesSpike
        expr: sum(rate(forgevcs_conflict_pauses_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ForgeVCS conflict pauses are spiking
          description: More than 0.1 paused conflicts/second over 5 minutes. Check which operation and lane is colliding.

      - alert: ForgeVCSRefCasContention
        expr: sum(rate(scion_ref_cas_failures_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ForgeVCS ref CAS contention is high
          description: Ref compare-and-swap losses are sustained. This means land retries, not lost refs.

      - alert: ForgeVCSLandP99Slow
        expr: histogram_quantile(0.99, sum by (le) (rate(scion_land_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ForgeVCS land p99 is above 2 seconds
          description: Land p99 has exceeded 2s for 10 minutes.

      - alert: ForgeVCSConflictContinueFailing
        expr: sum(rate(forgevcs_conflict_continues_total{result=~"land_failed|error"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ForgeVCS conflict continue is failing
          description: Paused-conflict continue attempts are ending in land_failed or error.
