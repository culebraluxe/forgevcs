# ForgeVCS policy (upstream SPEC 6.2; ADR-0002 D4).
#
# Deny by default: without a rule naming a principal, nothing can be read or written.
#
# TWO ROLES. The M0 contract was "all machine principals are agents"; that is no longer the
# model. Maestro is the orchestrator and holds the single DevOps seat; the OpenCode worker is a
# worker. Workers check in to their own refs, check out, read, diff and merge-base. Only the
# DevOps seat may create/delete repositories (`admin.repos`), provision/delete refs
# (`admin.refs`), or advance the trunk ref (`admin.trunk`) — enforced twice: the façade gates
# the request and the ref rule below denies the gRPC UpdateRef path too, so a rogue worker
# cannot reach the trunk by bypassing the façade.
#
# The principals themselves are configured in FORGEVCS_SERVICE_PRINCIPALS
# (`name=<sha256 of secret>`), so rotating a secret does not touch this file.
#
# `service:forgevcs-workspace` has no secret: the engine mints its token internally for the
# private Unix-socket gRPC client that scion-wc uses. It is privileged because the façade checks
# the external caller's policy before asking the working copy to read or write a path.

version = 1

[groups]
# `github:culebraluxe` is the human operator's first-class identity (docs/WORK-ORDER-HUMAN-CLI.md).
# A human configured in FORGEVCS_HUMAN_PRINCIPALS mints a token through POST /auth/human-token and
# is then authenticated as the same `github:<login>` principal the browser login issues; it is an
# ordinary policy member, granted the worker paths and the single DevOps seat because this human
# runs the repository lifecycle for ForgeVCS.
agents = ["service:maestro", "service:opencode", "service:forgevcs-workspace", "github:culebraluxe"]
devops = ["service:maestro", "github:culebraluxe"]

# The `/` rule is required by the parser and is the fallback for every path.
[[paths]]
prefix = "/"
read = ["group:agents"]
write = ["group:agents"]

# `main` is an exact rule, not a pattern: upstream bootstraps the root changeset on the ref
# literally named `main` (`RefName::main()`), and `"refs/heads/*"` does not match it.
#
# Trunk advance is the DevOps seat. Workers may still advance ordinary branches/lane refs;
# `admin.trunk` and this rule are both checked, so the deny does not depend on which surface
# the caller used.
[refs]
# The internal workspace principal also updates `main`: the façade checks the external
# caller's `admin.trunk` before submitting, then the working copy lands with its own
# (unmintable) principal. Without it, workspace submit is 403 for everyone.
"main" = { update = ["group:devops", "service:forgevcs-workspace"] }
"refs/heads/*" = { update = ["group:agents"] }

[admin]
refs = ["group:devops"]
repos = ["group:devops"]
trunk = ["group:devops"]

# ---------------------------------------------------------------------------------------------
# Repository scoping (FVCS-01, 2026-10-18)
#
# Repository identity is NOT expressed in this file. The vendored Scion parser is strict
# (`deny_unknown_fields`), so a `[repos]` table here would make this file unloadable. The service
# evaluates repository identity as a second, mandatory layer after this policy:
#
#   every business request must pass BOTH this path/ref policy AND `forgevcs_repo_acl`.
#
# The owner is claimed by the first successful `POST /repos/{repo}/init` (first writer wins; an
# idempotent init or a concurrent instance cannot reassign it). Operators can pre-assign an
# owner / readers / writers with `FORGEVCS_REPO_ACLS`, JSON, e.g.
#
#   {"pilot-a":{"owner":"service:agent-a","writers":["service:agent-a"]}}
#
# `admin.repos` (the DevOps seat, below) bypasses repository identity for administration but does
# NOT bypass the path/ref rules in this file. An ownerless repository is denied to agents.
#
# Path-prefix pushes (FVCS-02): `POST /repos/{repo}/push` authorizes each changeset delta path
# instead of requiring write on `/`, so a principal whose write grant is `lane/a/**` can push
# exactly those paths. Repository and ref provisioning still require the coarse root/ref gates.
# IMPORTANT: this file still grants `write` on `/` to `group:agents` (the pre-FVCS-02 default), so
# every agent keeps write everywhere until an operator narrows this rule to the lane prefixes an
# agent may push (e.g. replace `write = ["group:agents"]` on `/` with per-lane `[[paths]]` rules).
# Until then the push gate is path-fine but the policy still grants every path.
#
# See docs/M1-repo-acl-and-path-scopes.md.
