[package]
name = "forgevcs-service"
description = "ForgeVCS HTTP service — the Vercel-facing shell around vendored Scion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "forgevcs-service"
path = "src/main.rs"

[dependencies]
scion-obs = { workspace = true }
scion-store = { workspace = true }
scion-store-s3 = { workspace = true }
scion-store-crdb = { workspace = true, features = ["postgres"] }
scion-config = { workspace = true }
scion-auth = { workspace = true }
scion-policy = { workspace = true }
scion-server = { workspace = true }
scion-proto = { workspace = true }
scion-object = { workspace = true }
scion-wc = { workspace = true }
scion-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
tokio-stream = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
bytes = { workspace = true }
scion-core = { workspace = true }
